services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=development
      - MONGODB_URI=mongodb://mongodb:27017/vendeur-ia
      - REDIS_URL=redis://redis:6379
    depends_on:
      - mongodb
      - redis
    networks:
      - vendeur-network

  mongodb:
    image: mongo:6.0
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    networks:
      - vendeur-network

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    networks:
      - vendeur-network

networks:
  vendeur-network:
    driver: bridge

volumes:
  mongodb_data:
