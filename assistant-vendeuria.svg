<svg xmlns="http://www.w3.org/2000/svg" viewBox="235 235 770 815" width="100%" height="100%">
  <defs>
    <!-- Masque : Bulle pleine, robot découpé en transparence -->
    <mask id="bot-pure-cutout">
      <rect x="0" y="0" width="1254" height="1254" fill="#ffffff" />

      <!-- Casque du robot -->
      <path
        d="M 425,700
           C 425,525 505,480 622,480
           C 739,480 819,525 819,700
           C 819,815 735,845 622,845
           C 509,845 425,815 425,700 Z"
        fill="none"
        stroke="#000000"
        stroke-width="54"
        stroke-linecap="round"
        stroke-linejoin="round"
      />

      <!-- Antenne -->
      <line x1="622" y1="480" x2="622" y2="395" stroke="#000000" stroke-width="44" stroke-linecap="round" />
      <circle cx="622" cy="362" r="34" fill="#000000" />

      <!-- Écouteurs -->
      <path d="M 412,595 C 355,595 332,640 332,670 C 332,700 355,745 412,745" fill="#000000" />
      <path d="M 832,595 C 889,595 912,640 912,670 C 912,700 889,745 832,745" fill="#000000" />

      <!-- Microphone -->
      <path d="M 838,695 C 855,770 805,830 732,834" fill="none" stroke="#000000" stroke-width="40" stroke-linecap="round" />
      <ellipse cx="729" cy="834" rx="36" ry="30" fill="#000000" transform="rotate(-15 729 834)" />

      <!-- Yeux et Sourire -->
      <path d="M 494,680 C 506,648 550,648 562,680" fill="none" stroke="#000000" stroke-width="32" stroke-linecap="round" />
      <path d="M 681,680 C 693,648 737,648 749,680" fill="none" stroke="#000000" stroke-width="32" stroke-linecap="round" />
      <path d="M 578,760 C 595,788 648,788 665,760" fill="none" stroke="#000000" stroke-width="30" stroke-linecap="round" />
    </mask>
  </defs>

  <!-- Bulle de dialogue : Réplique exacte du PNG original assistant-vendeuria.png -->
  <path
    d="M 354,888
       A 372 372 0 1 1 500,984
       L 348,1028
       C 342,1030 338,1024 340,1018
       L 354,888
       Z"
    fill="#10B981"
    mask="url(#bot-pure-cutout)"
  />
</svg>
