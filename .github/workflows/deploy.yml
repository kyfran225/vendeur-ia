name: CI / Deploy

on:
  push:
    branches:
      - main
      - preview
  workflow_dispatch:
    inputs:
      environment:
        description: "Environnement à déployer"
        required: true
        default: "preview"
        type: choice
        options:
          - preview
          - production

# ─────────────────────────────────────────────
# Détermine l'environnement cible :
#   main   → production
#   preview / workflow_dispatch preview → preview
# ─────────────────────────────────────────────
env:
  IS_PROD: ${{ github.ref == 'refs/heads/main' || inputs.environment == 'production' }}

jobs:
  # ── 0. Tests ──────────────────────────────────────────────────────────────────
  test:
    name: Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.28.2

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Core package
        run: pnpm --filter @vendeur-ia/core build

      - name: Run API tests
        env:
          NODE_ENV: test
          MONGODB_URI: mongodb://localhost:27017/test
          JWT_SECRET: ci-test-secret-not-used
        run: pnpm --filter @vendeur-ia/api test

  # ── 1. Build & Deploy → Vercel ───────────────────────────────────────────────
  deploy-vercel:
    name: Build & Deploy → Vercel (${{ github.ref == 'refs/heads/main' && 'production' || 'preview' }})
    runs-on: ubuntu-latest
    needs: test
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.28.2

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Core package
        run: pnpm --filter @vendeur-ia/core build

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      - name: Pull Vercel project settings
        run: |
          if [ "${{ env.IS_PROD }}" = "true" ]; then
            vercel pull --yes --environment=production --token "$VERCEL_TOKEN"
          else
            vercel pull --yes --environment=preview --token "$VERCEL_TOKEN"
          fi

      - name: Build (Prebuilt)
        run: |
          if [ "${{ env.IS_PROD }}" = "true" ]; then
            vercel build --prod --token "$VERCEL_TOKEN"
          else
            vercel build --token "$VERCEL_TOKEN"
          fi

      - name: Deploy to Vercel
        run: |
          if [ "${{ env.IS_PROD }}" = "true" ]; then
            vercel deploy --prebuilt --prod --token "$VERCEL_TOKEN"
          else
            vercel deploy --prebuilt --token "$VERCEL_TOKEN"
          fi

  # ── 2. Deploy → Render (en parallèle avec Vercel) ────────────────────────────
  deploy-render:
    name: Deploy → Render (${{ github.ref == 'refs/heads/main' && 'production' || 'preview' }})
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Trigger Render deployment
        run: |
          set -euo pipefail
          if [ "${{ env.IS_PROD }}" = "true" ]; then
            RENDER_HOOK="${{ secrets.RENDER_DEPLOY_HOOK_URL }}"
            ENV_NAME="production"
          else
            RENDER_HOOK="${{ secrets.RENDER_PREVIEW_DEPLOY_HOOK_URL }}"
            ENV_NAME="preview"
          fi
          if [ -z "${RENDER_HOOK}" ]; then
            echo "❌ Render hook vide pour $ENV_NAME — vérifiez les GitHub Secrets"
            exit 1
          fi
          echo "🚀 Déclenchement du déploiement Render ($ENV_NAME)..."
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" -X POST "${RENDER_HOOK}")
          if [ "$HTTP_STATUS" -eq 200 ] || [ "$HTTP_STATUS" -eq 201 ] || [ "$HTTP_STATUS" -eq 202 ]; then
            echo "✅ Render $ENV_NAME deployment triggered ($HTTP_STATUS)"
          elif [ "$HTTP_STATUS" -eq 409 ]; then
            echo "ℹ️ Render deploy already in progress ($HTTP_STATUS)"
          else
            echo "❌ Render deploy hook returned HTTP $HTTP_STATUS"
            exit 1
          fi
