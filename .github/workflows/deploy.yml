name: Deployment

on:
  push:
    branches:
      - main
      - preview

jobs:
  deploy-vercel:
    name: Deploy to Vercel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Deploy to Vercel
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          vercel-args: "--scope ${{ secrets.VERCEL_ORG_ID }} ${{ github.ref == 'refs/heads/main' && '--prod' || '' }}"
          working-directory: .

  deploy-render:
    name: Deploy to Render
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render Deployment
        run: |
          if [ "${{ github.ref }}" == "refs/heads/main" ]; then
            URL="${{ secrets.RENDER_DEPLOY_HOOK_URL }}"
          else
            URL="${{ secrets.RENDER_PREVIEW_DEPLOY_HOOK_URL }}"
          fi

          if [ -z "$URL" ]; then
            echo "Error: Deployment hook URL not found for branch ${{ github.ref }}"
            exit 1
          fi

          curl -f -X POST "$URL"
