name: CI / Deploy

on:
  push:
    branches:
      - main
      - preview

# ─────────────────────────────────────────────
# Jobs
# ─────────────────────────────────────────────
jobs:
  # ── 0. Tests ──────────────────────────────────────────────────────────────────────
  test:
    name: Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.28.2

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run API tests
        run: pnpm --filter @vendeur-ia/api test

  # ── 1. Build & Deploy → Vercel (Prebuilt mode) ──────────────────────────────
  deploy-vercel:
    name: Build & Deploy → Vercel
    runs-on: ubuntu-latest
    needs: test
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.28.2

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Vercel CLI (latest)
        run: npm install -g vercel@latest

      # Pull project settings + env vars from Vercel
      - name: Pull Vercel project settings
        run: |
          if [ "$GITHUB_REF" = "refs/heads/main" ]; then
            vercel pull --yes --environment=production --token "$VERCEL_TOKEN"
          else
            vercel pull --yes --environment=preview --token "$VERCEL_TOKEN"
          fi

      # Build locally (Prebuilt mode) → produces .vercel/output/
      - name: Build (Prebuilt)
        run: |
          if [ "$GITHUB_REF" = "refs/heads/main" ]; then
            vercel build --prod --token "$VERCEL_TOKEN"
          else
            vercel build --token "$VERCEL_TOKEN"
          fi

      # Upload the pre-built artifact — Vercel skips its own build step
      - name: Deploy to Vercel
        run: |
          if [ "$GITHUB_REF" = "refs/heads/main" ]; then
            vercel deploy --prebuilt --prod --token "$VERCEL_TOKEN"
          else
            vercel deploy --prebuilt --token "$VERCEL_TOKEN"
          fi

  # ── 2. Trigger → Render ─────────────────────────────────────────────────────
  deploy-render:
    name: Deploy → Render
    runs-on: ubuntu-latest
    needs: deploy-vercel

    steps:
      - name: Trigger Render deployment
        env:
          RENDER_HOOK: ${{ github.ref == 'refs/heads/main' && secrets.RENDER_DEPLOY_HOOK_URL || secrets.RENDER_PREVIEW_DEPLOY_HOOK_URL }}
        run: |
          set -euo pipefail
          if [ -z "${RENDER_HOOK:-}" ]; then
            echo "❌ Render deploy hook URL is empty — vérifiez les GitHub Secrets"
            exit 1
          fi
          echo "🚀 Déclenchement du déploiement Render..."
          curl -fsS -X POST --url "$RENDER_HOOK"
          echo "✅ Render deployment triggered"
