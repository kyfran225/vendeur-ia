<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1254 1254" width="100%" height="100%">
  <!-- 1. Background: Squircle Vert Foncé -->
  <rect x="20" y="20" width="1214" height="1214" rx="275" ry="275" fill="#01524b" />

